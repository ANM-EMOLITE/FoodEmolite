<div class="space-y-6">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h1 class="md:text-[20px] font-semibold text-violet-400 uppercase tracking-widest">
        Cài Đặt
      </h1>
      <p class="mt-2 text-md leading-4 text-gray-500">
        Cài đặt tài khoản của đại lý
      </p>
    </div>
  </div>

  <div class="rounded-md border border-white/5 bg-[#171322]">
    <div class="flex border-b border-white/5">
      <button type="button" (click)="setTab('password')" class="px-5 py-3 text-sm font-medium transition"
        [class.text-violet-700]="activeTab() === 'password'" [class.border-b-2]="activeTab() === 'password'"
        [class.border-violet-600]="activeTab() === 'password'" [class.text-gray-500]="activeTab() !== 'password'">
        Đổi mật khẩu
      </button>
    </div>

    <div class="p-6">
      @if (activeTab() === 'password') {
      <div class="max-w-md space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-gray-300">Mật khẩu hiện tại</label>
          <input type="password" [(ngModel)]="passwordForm().oldPassword"
            class="h-[42px] w-full rounded-lg border border-[#322a4a] bg-[#1a1628] px-3 text-sm text-white placeholder:text-gray-500 outline-none transition hover:border-violet-500/60 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20" />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-gray-300">Mật khẩu mới</label>
          <input type="password" [(ngModel)]="passwordForm().newPassword"
            class="h-[42px] w-full rounded-lg border border-[#322a4a] bg-[#1a1628] px-3 text-sm text-white placeholder:text-gray-500 outline-none transition hover:border-violet-500/60 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20" />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-gray-300">Xác nhận mật khẩu mới</label>
          <input type="password" [(ngModel)]="passwordForm().confirmNewPassword"
            class="h-[42px] w-full rounded-lg border border-[#322a4a] bg-[#1a1628] px-3 text-sm text-white placeholder:text-gray-500 outline-none transition hover:border-violet-500/60 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20" />
        </div>

        <div class="flex justify-end">
          <button type="button" (click)="changePassword()" [disabled]="isSubmitting()"
            class="flex items-center justify-center gap-2 rounded-md bg-violet-600 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-violet-500 disabled:cursor-not-allowed disabled:opacity-50 cursor-pointer">
            {{ isSubmitting() ? 'Đang lưu...' : 'Đổi mật khẩu' }}
          </button>
        </div>
      </div>
      }
    </div>
  </div>
</div>
