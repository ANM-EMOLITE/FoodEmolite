<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 px-4">
  <div class="flex max-h-[90vh] w-full max-w-2xl flex-col rounded-md border border-[#322a4a] bg-[#171322] shadow-xl">
    <div class="flex items-center justify-between border-b border-[#322a4a] px-5 py-4">
      <div>
        <h2 class="text-base font-semibold text-violet-200">{{ isEdit() ? 'Cập nhật nhà cung cấp' : 'Thêm nhà cung cấp' }}</h2>
        @if (supplier(); as s) {
        <p class="mt-1 text-sm text-gray-400">{{ s.supplierCode }}</p>
        } @else {
        <p class="mt-1 text-sm text-gray-400">Mã nhà cung cấp được tạo tự động</p>
        }
      </div>

      <button type="button" (click)="closed.emit()" class="text-gray-400 transition hover:text-violet-300">✕</button>
    </div>

    <div class="grid gap-4 overflow-y-auto p-5 md:grid-cols-2">
      <div class="md:col-span-2">
        <label class="mb-1 block text-sm font-medium text-gray-300">Tên nhà cung cấp <span class="text-red-400">*</span></label>
        <input type="text" [ngModel]="form().supplierName" (ngModelChange)="patch({ supplierName: $event })"
          placeholder="Ví dụ: Công ty TNHH Thực phẩm ABC"
          class="h-10.5 w-full rounded-lg border border-[#322a4a] bg-[#1a1628] px-3 text-sm text-white placeholder:text-gray-500 outline-none transition hover:border-violet-500/60 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20" />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-gray-300">Người liên hệ</label>
        <input type="text" [ngModel]="form().contactName" (ngModelChange)="patch({ contactName: $event })"
          class="h-10.5 w-full rounded-lg border border-[#322a4a] bg-[#1a1628] px-3 text-sm text-white placeholder:text-gray-500 outline-none transition hover:border-violet-500/60 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20" />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-gray-300">Số điện thoại</label>
        <input type="tel" [ngModel]="form().phone" (ngModelChange)="patch({ phone: $event })"
          class="h-10.5 w-full rounded-lg border border-[#322a4a] bg-[#1a1628] px-3 text-sm text-white placeholder:text-gray-500 outline-none transition hover:border-violet-500/60 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20" />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-gray-300">Email</label>
        <input type="email" [ngModel]="form().email" (ngModelChange)="patch({ email: $event })"
          class="h-10.5 w-full rounded-lg border border-[#322a4a] bg-[#1a1628] px-3 text-sm text-white placeholder:text-gray-500 outline-none transition hover:border-violet-500/60 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20" />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-gray-300">Mã số thuế</label>
        <input type="text" [ngModel]="form().taxCode" (ngModelChange)="patch({ taxCode: $event })"
          class="h-10.5 w-full rounded-lg border border-[#322a4a] bg-[#1a1628] px-3 text-sm text-white placeholder:text-gray-500 outline-none transition hover:border-violet-500/60 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20" />
      </div>

      <div class="md:col-span-2">
        <label class="mb-1 block text-sm font-medium text-gray-300">Địa chỉ</label>
        <input type="text" [ngModel]="form().address" (ngModelChange)="patch({ address: $event })"
          class="h-10.5 w-full rounded-lg border border-[#322a4a] bg-[#1a1628] px-3 text-sm text-white placeholder:text-gray-500 outline-none transition hover:border-violet-500/60 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20" />
      </div>

      <div class="md:col-span-2">
        <label class="mb-1 block text-sm font-medium text-gray-300">Ghi chú</label>
        <textarea rows="3" [ngModel]="form().note" (ngModelChange)="patch({ note: $event })"
          class="w-full rounded-lg border border-[#322a4a] bg-[#1a1628] px-3 py-2 text-sm text-white placeholder:text-gray-500 outline-none transition hover:border-violet-500/60 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20"></textarea>
      </div>

      <label class="flex items-center gap-2 text-sm text-gray-300 md:col-span-2">
        <app-checkbox [checked]="form().isActive" (changed)="patch({ isActive: $event })" />
        Đang giao dịch
      </label>
    </div>

    <div class="flex justify-end gap-3 border-t border-[#322a4a] px-5 py-4">
      <button type="button" (click)="closed.emit()"
        class="rounded-md border border-[#322a4a] px-4 py-2 text-sm text-gray-300 transition hover:bg-white/5">
        Huỷ
      </button>
      <button type="button" (click)="submit()" [disabled]="!isValid() || isSubmitting()"
        class="rounded-md bg-violet-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-violet-500 disabled:cursor-not-allowed disabled:opacity-50">
        {{ isSubmitting() ? 'Đang lưu...' : 'Lưu' }}
      </button>
    </div>
  </div>
</div>
