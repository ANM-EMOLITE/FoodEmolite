<div class="space-y-3">
    <div class="flex items-start justify-between gap-4">
        <div>
            <h1 class="md:text-[20px] font-semibold text-violet-400 uppercase tracking-widest">
                Danh Sách Đơn Hàng
            </h1>
            <p class="mt-2 text-md leading-4 text-gray-500">
                Quản lý đơn hàng thuộc cửa hàng của đại lý
            </p>
        </div>

        <div class="flex items-center gap-2">
            <div class="flex items-center gap-1 pl-2 ml-2">
                <button type="button" title="In hóa đơn"
                    class="rounded-md border border-gray-300 bg-white p-2 text-gray-500 transition hover:bg-gray-100 hover:text-gray-700 disabled:cursor-not-allowed disabled:opacity-50"
                    [disabled]="selectedOrderIds().length === 0 || isSubmitting()" (click)="previewInvoiceSelected()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-printer-icon lucide-printer">
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                        <path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6" />
                        <rect x="6" y="14" width="12" height="8" rx="1" />
                    </svg>
                </button>

                <button type="button" title="Tải hóa đơn"
                    class="rounded-md border border-gray-300 bg-white p-2 text-gray-500 transition hover:bg-gray-100 hover:text-gray-700 disabled:cursor-not-allowed disabled:opacity-50"
                    [disabled]="selectedOrderIds().length === 0 || isSubmitting()" (click)="downloadInvoiceSelected()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-download-icon lucide-download">
                        <path d="M12 15V3" />
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <path d="m7 10 5 5 5-5" />
                    </svg>
                </button>
            </div>

            <button type="button"
                class="rounded-md border border-green-600 bg-green-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-green-700 disabled:cursor-not-allowed disabled:opacity-50"
                [disabled]="!canBulkConfirmPayment() || isSubmitting()" (click)="confirmPaymentSelected()">
                Xác nhận thanh toán
            </button>

        </div>
    </div>

    <app-filter [fields]="filterFields" [initialValues]="filter()" (filterChange)="onFilterChange($event)">
    </app-filter>
    <div></div>
    <app-table [columns]="columns" [rows]="rows()" [currentPage]="page()" [totalPages]="totalPages()"
        [totalRecords]="totalRecords()" [pageSize]="pageSize()" (pageSizeChange)="onPageSizeChange($event)"
        [loading]="loading() || isSubmitting()" [sortBy]="sortBy()" [asc]="asc()" emptyText="Không có đơn hàng"
        [rowActions]="rowActions" [rowClickToggle]="true" [rowSelectable]="isSelectableRow"
        [rowCheckDisabled]="isRowCheckDisabled" (actionClick)="onRowAction($event)" (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)" (rowCheckChange)="toggleSelected($event.row, $event.checked)"
        (allCheckChange)="toggleAllSelected($event)">
    </app-table>
</div>

@if (isInvoicePreviewOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="flex h-[90vh] w-full max-w-lg flex-col overflow-hidden rounded-xl bg-white shadow-xl">
        <div class="flex items-center justify-between border-b-[0.5px] px-5 py-4">
            <div>
                <h2 class="text-base font-semibold text-gray-900">
                    Danh Sách Đơn Hàng
                </h2>
                <p class="mt-1 text-sm text-gray-500">
                    Kiểm tra danh sách trước khi in hoặc tải xuống
                </p>
            </div>

            <button type="button" class="rounded-lg px-3 py-2 text-sm text-gray-500 hover:bg-gray-100 cursor-pointer" (click)="closeInvoicePreview()">
                Đóng
            </button>
        </div>

        <div class="flex-1 bg-gray-100">
            @if (invoicePreviewUrl()) {
            <iframe class="h-full w-full" [src]="invoicePreviewUrl()"></iframe>
            }   
        </div>

        <div class="flex justify-end gap-2 border-t px-5 py-4">
            <button type="button"
                class="rounded-lg bg-gray-700 px-4 py-2 text-sm font-medium text-white hover:bg-gray-800 cursor-pointer"
                (click)="downloadCurrentPreviewInvoice()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-arrow-down-to-line preview-icon">
                    <path d="M12 17V3" />
                    <path d="m6 11 6 6 6-6" />
                    <path d="M19 21H5" />
                </svg>
            </button>

            <button type="button"
                class="rounded-lg bg-purple-600 px-4 py-2 text-sm font-medium text-white hover:bg-purple-700 cursor-pointer"
                (click)="printCurrentPreviewInvoice()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-printer preview-icon">
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                    <path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6" />
                    <rect x="6" y="14" width="12" height="8" rx="1" />
                </svg>
            </button>
        </div>
    </div>
</div>
}
