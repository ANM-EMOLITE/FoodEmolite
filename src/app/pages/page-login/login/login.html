<div
  class="font-dialogue relative flex min-h-screen items-center justify-center overflow-hidden bg-[#0f0d1a] px-4 py-10">

  <div class="animate-blob pointer-events-none absolute -top-32 -left-24 h-96 w-96 rounded-full bg-violet-600/15 blur-3xl"></div>
  <div class="animate-blob pointer-events-none absolute -bottom-32 -right-24 h-96 w-96 rounded-full bg-fuchsia-600/10 blur-3xl"
    style="animation-delay: 2.5s;"></div>

  <a routerLink="/"
    class="absolute left-4 top-4 z-10 flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-white/70 transition hover:bg-white/10 hover:text-white sm:left-6 sm:top-6">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 19-7-7 7-7" />
      <path d="M19 12H5" />
    </svg>
    Về trang chủ
  </a>

  <div class="relative w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl shadow-[#2e1065]/40 sm:p-10">

    <div class="flex items-center justify-center gap-3">
      <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-[#7c3aed]">
        <img src="ei2.webp" class="h-8 w-8 rounded-md object-cover" />
      </div>
      <div>
        <p class="text-lg font-bold leading-none text-[#1e1b4b]">Food</p>
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-[#8b5cf6]">Emolite</p>
      </div>
    </div>

    <h1 class="mt-8 text-center text-3xl font-bold text-[#1e1b4b]">
      Đăng nhập
    </h1>

    <p class="mt-2 text-center text-sm text-[#71717a]">
      Chào mừng bạn quay trở lại
    </p>

    <form class="mt-8 space-y-4" (ngSubmit)="login()">
      <input
        class="w-full rounded-xl border border-[#e4def7] bg-[#f5f3ff] px-4 py-3.5 text-sm text-[#1e1b4b] outline-none transition placeholder:text-[#a1a1aa] focus:border-[#6d28d9] focus:bg-white focus:ring-4 focus:ring-[#6d28d9]/10"
        type="text" autocomplete="username" placeholder="Email hoặc username" [ngModel]="input()"
        (ngModelChange)="input.set($event)" name="input" />

      <div class="relative">
        <input
          class="w-full rounded-xl border border-[#e4def7] bg-[#f5f3ff] px-4 py-3.5 pr-12 text-sm text-[#1e1b4b] outline-none transition placeholder:text-[#a1a1aa] focus:border-[#6d28d9] focus:bg-white focus:ring-4 focus:ring-[#6d28d9]/10"
          [type]="showPassword() ? 'text' : 'password'" autocomplete="current-password" placeholder="Mật khẩu"
          [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" />

        <button type="button" (click)="togglePassword()"
          class="absolute right-3 top-1/2 flex h-8 w-8 -translate-y-1/2 cursor-pointer items-center justify-center rounded-lg text-[#8b5cf6] transition hover:bg-[#ede9fe] hover:text-[#6d28d9]">
          @if (showPassword()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-eye-off-icon lucide-eye-off">
            <path
              d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
            <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
            <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" />
            <path d="m2 2 20 20" />
          </svg>
          } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-eye-icon lucide-eye">
            <path
              d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          }
        </button>
      </div>

      @if (errorMessage()) {
      <div class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600">
        {{ errorMessage() }}
      </div>
      }

      <button type="submit"
        class="flex w-full cursor-pointer items-center justify-center rounded-xl bg-[#6d28d9] py-3.5 font-semibold text-white shadow-lg shadow-[#6d28d9]/30 transition hover:-translate-y-0.5 hover:bg-[#7c3aed] hover:shadow-[#6d28d9]/40 active:translate-y-0 disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0"
        [disabled]="isLoading()">
        @if (isLoading()) {
        <span class="mr-2 h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span>
        Đang đăng nhập...
        } @else {
        Đăng nhập
        }
      </button>

      <p class="pt-2 text-center text-sm text-[#71717a]">
        Chưa có tài khoản?
        <a class="font-semibold text-[#6d28d9] hover:underline" routerLink="/register">
          Đăng ký
        </a>
      </p>
    </form>
  </div>
</div>
