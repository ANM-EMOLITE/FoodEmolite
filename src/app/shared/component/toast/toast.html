<div class="pointer-events-none fixed inset-x-4 top-4 z-[9999] flex flex-col items-stretch gap-3 sm:inset-x-auto sm:right-5 sm:top-5 sm:w-[380px]">
  @for (toast of toastService.toasts(); track toast.id) {
  <div
    role="status"
    class="toast-enter pointer-events-auto relative overflow-hidden rounded-2xl border border-[#ede9fe] bg-[#ffffff] shadow-xl shadow-[#2e1065]/15">

    <div class="flex items-start gap-3 py-3.5 pl-5 pr-3">

      <div
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full"
        [class.bg-[#d1fae5]]="toast.type === 'success'"
        [class.bg-[#fee2e2]]="toast.type === 'error'">

        @if (toast.type === 'success') {
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.5l4.5 4.5L19 7.5" />
        </svg>
        } @else {
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6L6 18" />
          <path d="M6 6l12 12" />
        </svg>
        }
      </div>

      <div class="min-w-0 flex-1 pt-0.5">
        <p
          class="text-sm font-bold leading-5"
          [class.text-[#047857]]="toast.type === 'success'"
          [class.text-[#b91c1c]]="toast.type === 'error'">
          {{ toast.type === 'success' ? 'Thành công' : 'Có lỗi xảy ra' }}
        </p>

        <p class="mt-0.5 break-words text-sm leading-5 text-[#52525b]">
          {{ toast.message }}
        </p>
      </div>

      <button
        type="button"
        aria-label="Đóng"
        (click)="toastService.remove(toast.id)"
        class="flex h-7 w-7 shrink-0 cursor-pointer items-center justify-center rounded-full text-[#a1a1aa] transition hover:bg-[#f5f3ff] hover:text-[#6d28d9]">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6L6 18" />
          <path d="M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- thanh đếm ngược thời gian tự đóng -->
    <div class="h-1 w-full bg-[#f5f3ff]">
      <div
        class="toast-progress h-full origin-left"
        [class.bg-[#10b981]]="toast.type === 'success'"
        [class.bg-[#ef4444]]="toast.type === 'error'"
        [style.animation-duration.ms]="toast.duration">
      </div>
    </div>
  </div>
  }
</div>
